<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <body>
    <main class="flex flex-col h-screen md:flex-row">
      <!-- Sidebar Sidebar -->
      <!-- Hidden by default on mobile , visible on desktop -->
      <aside
        id="sidebar"
        class="bg-slate-900 w-80 h-screen fixed inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition duration-200 ease-in-out z-50 flex flex-col"
      >
        <div class="py-4 px-4 flex justify-between items-center bg-black">
          <img src="smartphone.png" class="w-9 h-7" />
          <p class="font-bold text-2xl text-white">Mobile shop</p>

          <!--menu close button div-->
          <div class="flex justify-center items-center py-3">
            <button
              id="menu-close"
              class="text-white md:hidden focus:outline-none"
            >
              <svg
                class="w-6 h-6"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M6 18L18 6M6 6l12 12"
                ></path>
              </svg>
            </button>
          </div>
        </div>

        <p class="pt-4 pl-4 text-gray-500 text-sm font-bold uppercase">
          Management
        </p>
        <div class="flex flex-col flex-1">
          <ul class="p-2 space-y-1">
            <li>
              <a
                href="#"
                class="block p-4 text-white hover:bg-purple-400 hover:rounded-lg hover:mx-2 transition"
                >Dashboard</a
              >
            </li>
            <li>
              <a
                href="#"
                class="block p-4 text-white hover:bg-purple-400 hover:rounded-lg hover:mx-2 transition"
                >Products</a
              >
            </li>
            <li>
              <a
                href="#"
                class="block p-4 text-white hover:bg-purple-400 hover:rounded-lg hover:mx-2 transition"
                >Orders</a
              >
            </li>
            <li>
              <a
                href="#"
                class="block p-4 text-white hover:bg-purple-400 hover:rounded-lg hover:mx-2 transition"
                >Users</a
              >
            </li>
          </ul>
          <div
            class="flex items-center justify-between mt-auto border-2 border-gray-500"
          >
            <button
              class="w-full text-white text-center border-2 border-gray-400 rounded-md py-2 m-4"
            >
              <a href="#" class="">Logout</a>
            </button>
          </div>
        </div>
      </aside>

      <!-- Optional Backdrop Overlay for Mobile -->
      <div
        id="sidebar-overlay"
        class="fixed inset-0 bg-black opacity-50 hidden md:hidden z-40"
      ></div>

      <!-- Container -->
      <article class="bg-slate-100 w-full flex flex-col">
        <section>
          <!--dashboard bar div-->
          <div class="bg-white flex gap-3">
            <div class="py-4 pl-2 ml-2">
              <button
                id="menu-toggle"
                class="text-black focus:outline-none md:hidden p-1"
              >
                <!-- Corrected SVG Namespace URL -->
                <svg
                  class="w-6 h-6"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  viewBox="0 0 24 24"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M4 6h16M4 12h16M4 18h16"
                  ></path>
                </svg>
              </button>
            </div>

            <h1 class="font-bold text-2xl py-4">Dashboard</h1>
          </div>

          <div class="bg-slate-100 grid grid-cols-2 md:grid-cols-4 p-4 gap-8">
            <div
              class="bg-white flex flex-row gap-4 p-6 rounded-lg shadow-lg hover:shadow-lg hover:scale-90 transition duration-300"
            >
              <div
                class="bg-green-100 w-10 h-10 rounded-xl flex items-center justify-center"
              >
                <i class="fa-solid fa-dollar-sign text-green-500 text-xl"></i>
              </div>
              <div class="">
                <p class="text-gray-700 text-sm">Total Sales</p>
                <p class="font-bold text-lg">$0.00</p>
              </div>
            </div>
            <div
              class="bg-white flex flex-row gap-4 p-6 rounded-lg shadow-lg hover:shadow-lg hover:scale-90 transition duration-300"
            >
              <div
                class="bg-blue-100 w-10 h-10 rounded-xl flex items-center justify-center"
              >
                <i class="fa-solid fa-cart-shopping text-blue-500 text-xl"></i>
              </div>
              <div>
                <p class="text-gray-700 text-sm">Total Order</p>
                <p class="font-bold text-lg">0</p>
              </div>
            </div>

            <div
              class="bg-white flex flex-row gap-4 p-6 rounded-lg shadow-lg hover:shadow-lg hover:scale-90 transition duration-300"
            >
              <div
                class="bg-purple-100 w-10 h-10 rounded-xl flex items-center justify-center"
              >
                <i class="fa-solid fa-person text-purple-500 text-xl"></i>
              </div>
              <div>
                <p class="text-gray-700 text-sm">Customer</p>
                <p class="font-bold text-lg">0</p>
              </div>
            </div>

            <div
              class="bg-white flex flex-row gap-4 p-6 rounded-lg shadow-lg hover:shadow-lg hover:scale-90 transition duration-300"
            >
              <div
                class="bg-red-100 w-10 h-10 rounded-xl flex items-center justify-center"
              >
                <i
                  class="fa-solid fa-triangle-exclamation text-red-500 text-xl"
                ></i>
              </div>
              <div>
                <p class="text-gray-700 text-sm">Low Stock items</p>
                <p class="font-bold text-lg">0</p>
              </div>
            </div>
          </div>
        </section>

        <!-- List -->

        <section>
          <div
            class="bg-white rounded-2xl shadow-sm border border-gray-200 m-4 p-6"
          >
            <div class="flex items-center justify-between mb-6">
              <h2 class="text-lg font-bold text-gray-800">Recent Orders</h2>

              <a
                href="#"
                class="text-sm font-medium text-pink-500 hover:text-pink-600 transition"
              >
                View all →
              </a>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full border-collapse">
                <!-- Table Head -->
                <thead>
                  <tr class="border-b border-gray-200">
                    <th
                      class="text-left text-xs font-semibold text-gray-400 uppercase py-4"
                    >
                      Order ID
                    </th>

                    <th
                      class="text-left text-xs font-semibold text-gray-400 uppercase py-4"
                    >
                      Customer
                    </th>

                    <th
                      class="text-left text-xs font-semibold text-gray-400 uppercase py-4"
                    >
                      Date
                    </th>

                    <th
                      class="text-left text-xs font-semibold text-gray-400 uppercase py-4"
                    >
                      Total
                    </th>

                    <th
                      class="text-left text-xs font-semibold text-gray-400 uppercase py-4"
                    >
                      Status
                    </th>
                  </tr>
                </thead>
              </table>
            </div>
          </div>
        </section>
      </article>
    </main>
    <script>
      const sidebar = document.getElementById("sidebar");
      const menuToggle = document.getElementById("menu-toggle");
      const menuClose = document.getElementById("menu-close");
      const overlay = document.getElementById("sidebar-overlay");

      // Open Sidebar
      menuToggle.addEventListener("click", () => {
        sidebar.classList.remove("-translate-x-full");
        overlay.classList.remove("hidden");
      });

      // Close Sidebar
      menuClose.addEventListener("click", () => {
        sidebar.classList.add("-translate-x-full");
        overlay.classList.add("hidden");
      });

      // Close when clicking overlay
      overlay.addEventListener("click", () => {
        sidebar.classList.add("-translate-x-full");
        overlay.classList.add("hidden");
      });
    </script>
  </body>
</html>
