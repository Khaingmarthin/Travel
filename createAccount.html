<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-blue-200 flex justify-center items-center h-screen">
    <main class="bg-white max-w-lg mx-auto p-8 rounded-xl shadow-xl">
      <div class="flex justify-center items-center">
        <img
          src="signIn.png"
          alt="Register"
          class="w-16 bg-red-400 p-4 rounded-2xl mb-2"
        />
      </div>
      <div class="text-center">
        <h1 class="font-bold mt-2 text-2xl">Create Account</h1>
        <p class="text-slate-500">Join us today and get started!</p>
      </div>
      <form action="" method="" class="mt-5">
        <div class="grid grid-cols-1 md:grid-cols-2">
          <div>
            <label for="username">Username</label>
            <input type="text" id="username" name="usrname" required class="" />
          </div>
          <div>
            <label for="email">Email</label>
            <input type="email" id="email" class="email" required />
          </div>
        </div>
        <div class="flex flex-col">
          <label for="password">Password</label>
          <input type="password" required minlength="8"  />
        </div>
        <div class="flex flex-col">
          <label for="confirmpw">Confirm Password</label>
          <input type="password" />
        </div>
        <div class="flex gap-2">
          <input type="checkbox" id="terms" name="terms" required />
          <p for="terms">
            I agree to the <a href="terms.html">terms</a> and
            <a href="privacy.html">Privacy Policy.</a>
          </p>
        </div>
        <button type="submit" class="bg-blue-600 text-white">Create Account >></button>
      </form>
      <p>Already </p>
    </main>
  </body>
</html>
