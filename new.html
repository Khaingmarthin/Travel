<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <main class="relative overflow-hidden bg-white min-h-screen">
      <!-- Background Decoration -->
      <img
        src="Decore.png"
        alt="Decore"
        class="absolute top-0 right-0 w-[600px] opacity-90 z-10"
      />

      <!-- Navbar -->
      <nav
        class="flex justify-between px-6 py-1 font-[17px] w-full m-auto fixed top-auto left-0 right-0 z-50"
      >
        <img src="logo.png" alt="Logo" class="w-26 h-7 ml-20" />
        <div class="flex space-x-8 text-white mr-24 text-center">
          <a
            href="destination.html"
            class="text-lg text-center text-black hover:text-gray-300 px-2 py-1"
            >Destinations</a
          >
          <a
            href="hotels.html"
            class="text-lg text-center text-black hover:text-gray-300 px-2 py-1"
            >Hotels</a
          >
          <a
            href="flights.html"
            class="text-lg text-center text-black hover:text-gray-300 px-2 py-1"
            >Flights</a
          >
          <a
            href="bookings.html"
            class="text-lg text-center text-black hover:text-gray-300 px-2 py-1"
            >Bookings</a
          >
          <a
            href="login.html"
            class="text-lg text-center text-black hover:text-gray-300 px-2 py-1"
            >Login</a
          >
          <a
            href="signup.html"
            class="text-lg text-center text-black hover:text-blue-600 border-2 border-[#212832] rounded-md px-2 py-1"
            >Sign up</a
          >
          <select class="bg-transparent text-black">
            <option class="text-lg text-center" value="en">EN</option>
            <option class="text-lg text-center" value="es">ES</option>
          </select>
        </div>
      </nav>

      <!-- Hero Section -->
      <section
        class="max-w-7xl mx-auto flex items-center justify-between px-12 py-16"
      >
        <!-- Left Content -->
        <div class="max-w-xl space-y-6">
          <p class="text-[#df6951] font-bold">
            BEST DESTINATIONS AROUND THE WORLD
          </p>

          <div class="relative">
            <img
              src="Decore (1).png"
              alt="Decore"
              class="absolute right-10 top-20 w-60 -z-0"
            />

            <h1
              class="text-7xl font-serif font-semibold text-[#181e4b] leading-tight"
            >
              Travel, enjoy and live a new and full life
            </h1>
          </div>

          <p class="text-gray-600 leading-7">
            Built Wicket longer admire do barton vanity itself do in it.
            Preferred to sportsmen it engrossed listening.
          </p>

          <div class="flex items-center gap-6">
            <button
              class="bg-yellow-500 text-white px-8 py-4 rounded-xl shadow-lg"
            >
              Find out more
            </button>

            <img src="Play Demo.png" alt="Play Demo" class="w-40 mt-5" />
          </div>
        </div>

        <!-- Right Images -->
        <div class="relative flex justify-center items-center">
          <!-- Main Woman -->
          <img
            src="woman.png"
            alt="Woman"
            class="w-[520px] relative mt-12 mr-24 z-10"
          />

          <!-- Plane 1 -->
          <img
            src="plane.png"
            alt="plane"
            class="absolute w-32 rotate-12 top-10 left-10 z-10 rotate-60"
          />

          <!-- Plane 2 -->
          <img
            src="plane.png"
            alt="plane"
            class="absolute w-32 rotate-12 bottom-80 right-12 z-10 rotate-40"
          />
        </div>
      </section>
    </main>
  </body>
</html>
