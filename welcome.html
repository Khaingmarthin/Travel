<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body class="bg-blue-200 flex justify-center items-center h-screen">
    <main class="bg-white max-w-lg mx-auto p-8 rounded-xl shadow-xl">
      <div class="flex justify-center items-center">
        <img
          src="lock.png"
          alt="Welcome"
          class="w-16 bg-indigo-100 p-4 rounded-2xl mb-2"
        />
      </div>
      <div class="text-center">
        <h1 class="font-bold mt-2 text-2xl">Welcome Back</h1>
        <p class="text-slate-500 mt-2">
          Enter your credentials to access your account.
        </p>
      </div>
      <form
        action=""
        method=""
        class="mx-auto p-6 rounded-xl bg-white space-y-4 mt-2"
      >
        <div class="flex flex-col gap-2">
          <div class="flex flex-col">
            <label for="username" class="mb-1 font-sm font-bold"
              >Email Address</label
            >
            <input
              type="email"
              id="username"
              name="username"
              placeholder="name@company.com"
              required
              class="bg-slate-50 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
            />
          </div>
          <div class="flex flex-col">
            <label for="password" class="mb-1 font-sm font-bold"
              >Password</label
            >
            <input
              type="password"
              id="password"
              placeholder="••••••••"
              class="bg-slate-50 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
              required
            />
          </div>
          <div class="flex gap-14 mt-3">
            <div class="flex gap-1">
              <input type="checkbox" id="check" name="check" required />
              <p class="text-gray-600 text-sm">Remember me</p>
            </div>
            <div>
              <p class="text-blue-700 text-sm">
                <a href="forgrt-password.html ">Forgot Password?</a>
              </p>
            </div>
          </div>

          <div class="flex items-center justify-center mt-3 gap-2">
            <button
              class="bg-blue-500 hover:bg-blue-800 w-full text-white font-bold py-2 px-2 rounded-lg shadow-xl"
            >
              Log In<img
                src="singleArrow.png"
                alt="singleArrow"
                class="w-5 inline-block ml-2"
              />
            </button>
          </div>
        </div>
      </form>
      <div class="flex items-center justify-center gap-1">
        <p class="text-sm text-gray-600">Don't have an account yet?</p>
        <a href="sing-in.html" class="text-blue-700 text-sm font-bold"
          >Sign up for free</a
        >
      </div>
    </main>
  </body>
</html>
